version: '3.8'

services:
  odoo17:
    build: .
    image: odoo17:latest
    container_name: odoo17
    ports:
      - "8070:8069"  # expose to host on 8070 so it doesn't conflict with existing Odoo19
    environment:
      - HOST=host.docker.internal
      - PORT=5432
      - DB_USER=${ODOO_DB_USER}
      - DB_PASSWORD=""
      - DB_NAME=${ODOO_DB_NAME}
      - ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD}
    command: bash -c "chown -R 1000:1000 /var/lib/odoo || true; exec odoo -c /etc/odoo/odoo.conf"
    entrypoint: []
    volumes:
      - ./addons:/mnt/extra-addons
      - ./filestore:/var/lib/odoo
      - ./config:/etc/odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
