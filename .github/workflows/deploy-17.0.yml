name: Deploy Odoo 17

on:
  push:
    branches: [ '17.0' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VM (minimal)
        run: |
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} << 'ENDSSH'
            set -e
            cd ~/odoo17 || exit 1
            
            git fetch --all
            git reset --hard origin/17.0

            # Ensure required directories exist
            mkdir -p filestore config addons
            
            docker system prune -f || true

            docker-compose pull || true
            docker-compose up -d --build --remove-orphans || true
            
            sleep 10
            docker inspect -f '{{.State.Running}}' odoo17 | grep -q "true"
          ENDSSH

      - name: Health check
        continue-on-error: true
        run: |
          sleep 45
          curl -Isf http://${{ secrets.VM_HOST }}:8070/web/login || echo "Odoo is warming up..."
